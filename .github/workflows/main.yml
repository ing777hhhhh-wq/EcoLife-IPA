name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Force Build
        run: |
          cd mobile/mobile/
          npm install --force
          npx expo export:embed --platform ios --output-dir dist
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: EcoLife-Final-IPA
          path: mobile/mobile/dist/*.ipa
