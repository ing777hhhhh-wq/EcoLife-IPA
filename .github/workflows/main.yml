name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Find and Install
        run: |
          # البحث عن مكان ملف package.json الحقيقي بعيداً عن المجلدات المكررة
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "App found in: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install --force

      - name: Build and Export
        run: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          mkdir -p dist
          # بناء التطبيق بدون الحاجة لشهادات حالياً للتجربة
          npx expo export:embed --platform ios --output-dir dist --dev false

      - name: Upload Everything
        uses: actions/upload-artifact@v4
        with:
          name: EcoLife-App-Files
          path: "**/dist/*"
